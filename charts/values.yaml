# Namespaces to create, with the labels each one carries.
#
# The labels are not decoration: NetworkPolicy `namespaceSelector` and
# RoleBinding scoping both key off them, so the label IS the grant.
#   tier            - platform (shared services) vs tenant (customer workloads)
#   platform-access - whether this tenant may reach services in `platform`.
#                     client-a has it, client-b deliberately does not, so
#                     client-b acts as the negative control for policy demos.
namespaces:
  - name: platform
    labels:
      tier: platform
  - name: client-a
    labels:
      tier: tenant
      platform-access: "true"
  - name: client-b
    labels:
      tier: tenant

# Labels applied to every namespace above.
globalLabels:
  team: mle-platform
  part-of: k8s-for-mle-part-2
