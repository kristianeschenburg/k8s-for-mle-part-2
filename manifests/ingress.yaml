# ingress rules are namespaced

# The frontend gets its own Ingress with no rewrite: Dash serves everything
# under url_base_pathname='/frontend/', so the path must be passed through as-is.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: client-a
spec:
  ingressClassName: nginx # links this manifest to the NGINX controller
  rules:
  - host: apps.part-2.test
    http:
      paths:
      - path: /frontend
        pathType: Prefix
        backend:
          service:
            name: part-2-frontend
            port:
              number: 8050

---
# OPTIONAL -- for Ingress vs. Gateway API comparison only (see httproute-backends.yaml).
# With network-policies.yaml applied, these are blocked: the backends only
# accept traffic from their in-cluster callers.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform
  namespace: platform
  annotations:
    # Captures everything after the path and rewrites it to the root of the application
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
  - host: apps.part-2.test
    http:
      paths:
      - path: /user-backend(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: user-backend
            port:
              number: 8000

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: salary-backend
  namespace: client-a
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
  - host: apps.part-2.test
    http:
      paths:
      - path: /salary-backend(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: salary-backend
            port:
              number: 8001
