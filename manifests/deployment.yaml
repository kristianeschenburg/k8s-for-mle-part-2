        app: part-2-salary
    spec:
      serviceAccountName: salary-backend-sa
      containers:
      - image: salary-backend:latest
        ports:
          - containerPort: 8001
        name: salary
        resources: {}
        imagePullPolicy: Never
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 5
