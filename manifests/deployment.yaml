---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: part-2-frontend
  name: part-2-frontend
  namespace: client-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: part-2-frontend
  strategy: {}
  template:
    metadata:
      labels:
        app: part-2-frontend
    spec:
      serviceAccountName: part-2-frontend-sa
      containers:
      - image: part-2-frontend:latest
        ports:
          - containerPort: 8050
        name: frontend
        resources: {}
        imagePullPolicy: Never
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8050
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8050
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        env:
        - name: USER_BACKEND_URL
          valueFrom:
            configMapKeyRef:
              name: client-a
              key: user_backend_url
        - name: SALARY_BACKEND_URL
          valueFrom:
            configMapKeyRef:
              name: client-a
              key: salary_backend_url
        - name: REQUEST_TIMEOUT
          valueFrom:
            configMapKeyRef:
              name: client-a
              key: request_timeout
        - name: POD_PANEL_NAMESPACES
          valueFrom:
            configMapKeyRef:
              name: client-a
              key: pod_panel_namespaces
        # the pod panel lists pods in its own namespace (downward API)
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
status: {}
