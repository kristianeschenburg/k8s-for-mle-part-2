# three deployments
## platform namespace
#### user-backend

## client-a namespace
#### salary-backend
#### frontend

# can see why using Helm charts / tempaltes here would be useful

apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: part-2-users
  name: part-2-users
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: part-2-users
  strategy: {}
  template:
    metadata:
      labels:
        app: part-2-users
    spec:
      serviceAccountName: user-backend-sa
      containers:
      - image: user-backend:latest
        ports:
          - containerPort: 8000
        name: users
        resources: {}
        imagePullPolicy: Never
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5 
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        env:
        - name: DATA_FILE
          valueFrom:
            configMapKeyRef:
              name: platform
              key: data_file
        - name: SLEEP_DURATION
          valueFrom:
            configMapKeyRef:
              name: platform
              key: sleep_duration
status: {}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: part-2-salary
  name: part-2-salary
  namespace: client-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: part-2-salary
  strategy: {}
  template:
    metadata:
